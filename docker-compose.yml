services:
  # postgres-db is intentionally not used: the app connects to the native
  # Windows Postgres instance (already populated) via host.docker.internal
  # instead of a containerized database. See DATABASE_URL below.

  api-server:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: market-api
    restart: always
    command: uvicorn api.main:app --host 0.0.0.0 --port 8000
    env_file:
      - .env
    environment:
      - DATABASE_URL=postgresql://${DB_USER}:${DB_PASSWORD}@host.docker.internal:${DB_PORT:-5432}/${DB_NAME}
    ports:
      - "8000:8000"
    extra_hosts:
      - "host.docker.internal:host-gateway"

  dashboard-server:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: market-dashboard
    restart: always
    command: python dashboard/server.py
    env_file:
      - .env
    environment:
      - DATABASE_URL=postgresql://${DB_USER}:${DB_PASSWORD}@host.docker.internal:${DB_PORT:-5432}/${DB_NAME}
    ports:
      - "8050:8050"
    extra_hosts:
      - "host.docker.internal:host-gateway"

  tick-downloader:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: market-tick-downloader
    # tick_downloader.py connects once, blocks on the WebSocket, and exits
    # cleanly (code 0) when the session/day ends — on-failure would never
    # restart it after that, leaving it dead until the next manual restart.
    restart: unless-stopped
    command: python downloader/tick_downloader.py
    env_file:
      - .env
    environment:
      - DATABASE_URL=postgresql://${DB_USER}:${DB_PASSWORD}@host.docker.internal:${DB_PORT:-5432}/${DB_NAME}
      # Matches the other services. Tick timestamps are now converted through
      # an explicit IST offset in code, so this is belt-and-braces rather than
      # load-bearing — it keeps container-local log timestamps readable too.
      - TZ=Asia/Kolkata
    extra_hosts:
      - "host.docker.internal:host-gateway"

  ohlcv-scheduler:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: market-ohlcv-scheduler
    restart: unless-stopped
    command: python -m scheduler.ohlcv_scheduler
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://${DB_USER}:${DB_PASSWORD}@host.docker.internal:${DB_PORT:-5432}/${DB_NAME}
      TZ: Asia/Kolkata
    extra_hosts:
      - "host.docker.internal:host-gateway"

  instrument-sync-scheduler:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: market-instrument-sync-scheduler
    restart: unless-stopped
    command: python -m scheduler.instrument_sync_scheduler
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://${DB_USER}:${DB_PASSWORD}@host.docker.internal:${DB_PORT:-5432}/${DB_NAME}
      TZ: Asia/Kolkata
    extra_hosts:
      - "host.docker.internal:host-gateway"

  react-frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: market-frontend
    restart: always
    ports:
      - "5173:5173"
    environment:
      - VITE_API_URL=http://localhost:8000
    depends_on:
      - api-server
