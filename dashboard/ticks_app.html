<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Live Market Depth</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        :root {
            --bg: #0f172a;
            --surface: #1e293b;
            --primary: #3b82f6;
            --text: #f8fafc;
            --text-muted: #94a3b8;
            --buy: #10b981;
            --sell: #ef4444;
            --border: #334155;
            --ltp: #f59e0b; /* Amber */
        }
        body {
            margin: 0;
            font-family: 'Inter', system-ui, -apple-system, sans-serif;
            background-color: var(--bg);
            color: var(--text);
            padding: 2rem;
        }
        .container {
            max-width: 1200px;
            margin: 0 auto;
        }
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 2rem;
            padding: 1.5rem;
            background: var(--surface);
            border-radius: 1rem;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.2);
            border: 1px solid var(--border);
        }
        select {
            background: var(--bg);
            color: var(--text);
            border: 1px solid var(--border);
            padding: 0.75rem 1rem;
            border-radius: 0.5rem;
            font-size: 1rem;
            outline: none;
            cursor: pointer;
            min-width: 200px;
        }
        select:focus {
            border-color: var(--primary);
        }
        .ltp-display {
            text-align: right;
            min-width: 120px;
        }
        .ltp-value {
            font-size: 2.5rem;
            font-weight: bold;
            color: var(--primary);
            transition: color 0.2s ease, text-shadow 0.2s ease;
        }
        .cards {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 2rem;
        }
        .card {
            background: var(--surface);
            border-radius: 1rem;
            padding: 1.5rem;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.2);
            border: 1px solid var(--border);
            margin-bottom: 2rem;
        }
        .card h2 {
            margin-top: 0;
            font-size: 1.25rem;
            color: var(--text-muted);
            margin-bottom: 1.5rem;
            text-align: center;
            display: flex;
            justify-content: space-between;
        }
        .flash-up { color: var(--buy) !important; text-shadow: 0 0 15px rgba(16,185,129,0.8); }
        .flash-down { color: var(--sell) !important; text-shadow: 0 0 15px rgba(239,68,68,0.8); }
        canvas {
            width: 100% !important;
        }
        .bar-charts canvas {
            height: 300px !important;
        }
        .line-chart canvas {
            height: 300px !important; 
        }
        .loading {
            font-size: 0.8rem;
            color: var(--primary);
            visibility: hidden;
            animation: pulse 1s infinite;
        }
        @keyframes pulse {
            0% { opacity: 1; }
            50% { opacity: 0.5; }
            100% { opacity: 1; }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <div>
                <h1 style="margin: 0; font-size: 1.5rem;">Live Market Depth</h1>
                <p style="margin: 0.5rem 0 0 0; color: var(--text-muted);">Real-time ticker stream via WebSocket</p>
            </div>
            
            <div style="display: flex; gap: 3rem; align-items: center;">
                <div>
                    <label style="display: block; font-size: 0.875rem; color: var(--text-muted); margin-bottom: 0.5rem;">Select Instrument</label>
                    <select id="instrumentSelect">
                        <option value="" disabled selected>Waiting for data...</option>
                    </select>
                </div>
                <div class="ltp-display">
                    <div style="font-size: 0.875rem; color: var(--text-muted); margin-bottom: 0.25rem;">Current Imbalance</div>
                    <div class="ltp-value" id="imbalanceValue" style="font-size: 1.8rem; color: var(--text);">---</div>
                </div>
                <div class="ltp-display">
                    <div style="font-size: 0.875rem; color: var(--text-muted); margin-bottom: 0.25rem;">LTP</div>
                    <div class="ltp-value" id="ltpValue">---</div>
                </div>
            </div>
        </div>

        <div class="cards bar-charts">
            <div class="card">
                <h2>Best 5 Buy (Bid)</h2>
                <canvas id="buyChart"></canvas>
            </div>
            <div class="card">
                <h2>Best 5 Sell (Ask)</h2>
                <canvas id="sellChart"></canvas>
            </div>
        </div>
        
        <div class="card line-chart">
            <h2>
                <span>Order Book Imbalance vs. Price Trend</span>
                <span id="loadingIndicator" class="loading">Loading History...</span>
            </h2>
            <canvas id="imbalanceChart"></canvas>
        </div>
    </div>

    <script>
        // State
        const instruments = new Set();
        let selectedInstrumentId = null;
        let lastLtp = null;
        
        // Settings
        const MAX_HISTORY_POINTS = 2000;

        // Fetch available instruments immediately on load
        async function fetchAvailableInstruments() {
            try {
                const res = await fetch('/api/instruments');
                const data = await res.json();
                if (Array.isArray(data)) {
                    data.forEach(id => {
                        const i_id = String(id);
                        if (!instruments.has(i_id)) {
                            instruments.add(i_id);
                            const opt = document.createElement('option');
                            opt.value = i_id;
                            opt.text = `Instrument ID: ${i_id}`;
                            selectEl.appendChild(opt);
                        }
                    });
                    
                    // Auto-select the first valid option if no selection yet
                    if (data.length > 0 && !selectedInstrumentId) {
                        selectEl.options[0].disabled = true;
                        selectEl.value = String(data[0]);
                        selectEl.dispatchEvent(new Event('change'));
                        document.getElementById('instrumentSelect').options[0].text = "Select an instrument...";
                    }
                }
            } catch (err) {
                console.error("Failed fetching instruments list:", err);
            }
        }
        fetchAvailableInstruments();

        // Common Chart Settings
        const chartOptions = {
            responsive: true,
            maintainAspectRatio: false,
            animation: { duration: 200 }, 
            scales: {
                y: { beginAtZero: true, grid: { color: '#334155' }, ticks: { color: '#94a3b8' } },
                x: { grid: { display: false }, ticks: { color: '#94a3b8', font: {size: 13} } }
            },
            plugins: { legend: { display: false }, tooltip: { mode: 'index', intersect: false } }
        };

        // Buy Depth Chart
        const ctxBuy = document.getElementById('buyChart').getContext('2d');
        const buyChart = new Chart(ctxBuy, {
            type: 'bar',
            data: { labels: [], datasets: [{ data: [], backgroundColor: '#10b981', borderRadius: 6 }] },
            options: chartOptions
        });

        // Sell Depth Chart
        const ctxSell = document.getElementById('sellChart').getContext('2d');
        const sellChart = new Chart(ctxSell, {
            type: 'bar',
            data: { labels: [], datasets: [{ data: [], backgroundColor: '#ef4444', borderRadius: 6 }] },
            options: chartOptions
        });
        
        // Imbalance vs Price Line Chart
        const ctxImb = document.getElementById('imbalanceChart').getContext('2d');
        const imbalanceChart = new Chart(ctxImb, {
            type: 'line',
            data: { 
                labels: [], 
                datasets: [
                    { 
                        label: 'Imbalance %',
                        yAxisID: 'y',
                        data: [], 
                        borderColor: '#3b82f6',
                        backgroundColor: 'rgba(59, 130, 246, 0.2)',
                        fill: true,
                        tension: 0.3, 
                        pointRadius: 0, 
                        borderWidth: 2
                    },
                    { 
                        label: 'LTP',
                        yAxisID: 'y1',
                        data: [], 
                        borderColor: '#f59e0b',
                        backgroundColor: 'transparent',
                        fill: false,
                        tension: 0.1, 
                        pointRadius: 0, 
                        borderWidth: 2,
                        borderDash: [5, 5] // Dashed line to differentiate
                    },
                    { 
                        label: 'Microprice',
                        yAxisID: 'y1',
                        data: [], 
                        borderColor: '#a855f7', // Purple line
                        backgroundColor: 'transparent',
                        fill: false,
                        tension: 0.1, 
                        pointRadius: 0, 
                        borderWidth: 2
                    }
                ] 
            },
            options: {
                ...chartOptions,
                animation: { duration: 0 }, 
                plugins: {
                    legend: { display: true, labels: { color: '#94a3b8' } },
                    tooltip: { mode: 'index', intersect: false }
                },
                scales: {
                    y: { 
                        type: 'linear',
                        display: true,
                        position: 'left',
                        grid: { color: '#334155', zeroLineColor: '#94a3b8' }, 
                        ticks: { color: '#94a3b8' },
                        suggestedMin: -100,
                        suggestedMax: 100,
                        title: { display: true, text: 'Imbalance %', color: '#94a3b8' }
                    },
                    y1: {
                        type: 'linear',
                        display: true,
                        position: 'right',
                        grid: { drawOnChartArea: false }, 
                        ticks: { color: '#f59e0b' },
                        title: { display: true, text: 'Price (LTP / Micro)', color: '#f59e0b' }
                    },
                    x: { grid: { display: false }, ticks: { display: false } }
                }
            }
        });

        // UI Elements
        const selectEl = document.getElementById('instrumentSelect');
        const ltpEl = document.getElementById('ltpValue');
        const imbEl = document.getElementById('imbalanceValue');
        const loadingEl = document.getElementById('loadingIndicator');

        // Reset state on instrument change & Trigger fetch
        selectEl.addEventListener('change', async (e) => {
            selectedInstrumentId = e.target.value;
            ltpEl.innerText = "Fetch...";
            imbEl.innerText = "Fetch...";
            imbEl.style.color = "var(--text)";
            lastLtp = null;
            
            // Clear Depth charts
            buyChart.data.labels = []; buyChart.data.datasets[0].data = []; buyChart.update();
            sellChart.data.labels = []; sellChart.data.datasets[0].data = []; sellChart.update();
            
            // Clear Line chart
            imbalanceChart.data.labels = []; 
            imbalanceChart.data.datasets[0].data = []; 
            imbalanceChart.data.datasets[1].data = []; 
            if (imbalanceChart.data.datasets[2]) imbalanceChart.data.datasets[2].data = []; 
            imbalanceChart.update();

            // Fetch History Data
            loadingEl.style.visibility = 'visible';
            try {
                const res = await fetch(`/api/history/${selectedInstrumentId}`);
                const historyData = await res.json();
                
                if (historyData && Array.isArray(historyData)) {
                    // Populate history without updating UI charts heavily per iteration
                    historyData.forEach(tick => {
                        processTickToCharts(tick, false);
                    });
                    
                    // Final update after bulk loading
                    imbalanceChart.update();

                    // Display static latest values
                    if (historyData.length > 0) {
                        const lastTick = historyData[historyData.length - 1];
                        
                        // Set LTP
                        const finalLtp = parseFloat(lastTick.ltp || lastTick.LTP);
                        if (!isNaN(finalLtp)) ltpEl.innerText = finalLtp.toFixed(2);
                        
                        // Set Imbalance
                        const tb = parseFloat(lastTick.total_buy_qty || 0);
                        const ts = parseFloat(lastTick.total_sell_qty || 0);
                        if (tb + ts > 0) {
                            const imb = ((tb - ts) / (tb + ts)) * 100;
                            imbEl.innerText = (imb > 0 ? "+" : "") + imb.toFixed(2) + "%";
                            imbEl.style.color = imb > 0 ? "var(--buy)" : (imb < 0 ? "var(--sell)" : "var(--text)");
                            imbalanceChart.data.datasets[0].borderColor = imb > 0 ? '#10b981' : '#ef4444';
                            imbalanceChart.data.datasets[0].backgroundColor = imb > 0 ? 'rgba(16, 185, 129, 0.1)' : 'rgba(239, 68, 68, 0.1)';
                        }
                        
                        // Set Bar Charts
                        let b5_buy = lastTick.best_5_buy || [];
                        let b5_sell = lastTick.best_5_sell || [];
                        if(typeof b5_buy === 'string') { try { b5_buy = JSON.parse(b5_buy); } catch(e) {} }
                        if(typeof b5_sell === 'string') { try { b5_sell = JSON.parse(b5_sell); } catch(e) {} }

                        buyChart.data.labels = b5_buy.map(b => Number(b.price || 0).toFixed(2));
                        buyChart.data.datasets[0].data = b5_buy.map(b => Number(b.quantity || 0));
                        buyChart.update();

                        sellChart.data.labels = b5_sell.map(s => Number(s.price || 0).toFixed(2));
                        sellChart.data.datasets[0].data = b5_sell.map(s => Number(s.quantity || 0));
                        sellChart.update();
                    }
                }
            } catch (err) {
                console.error("Historical data fetch error:", err);
                ltpEl.innerText = "Error";
            } finally {
                loadingEl.style.visibility = 'hidden';
            }
        });

        // Setup WebSocket connection
        const wsProtocol = window.location.protocol === 'https:' ? 'wss:' : 'ws:';
        const wsUrl = `${wsProtocol}//${window.location.host}/ws`;
        const ws = new WebSocket(wsUrl);
        
        ws.onmessage = (event) => {
            const data = JSON.parse(event.data);
            processTickToCharts(data, true);
        };
        ws.onopen = () => { console.log('Connected to WebSocket server'); };
        ws.onclose = () => { console.log('Disconnected from WebSocket server'); };

        // Unified chart ingestion logic
        function processTickToCharts(data, isLive) {
            let b5_buy = data.best_5_buy || data.BEST_5_BUY || [];
            let b5_sell = data.best_5_sell || data.BEST_5_SELL || [];
            if(typeof b5_buy === 'string') { try { b5_buy = JSON.parse(b5_buy); } catch(e) {} }
            if(typeof b5_sell === 'string') { try { b5_sell = JSON.parse(b5_sell); } catch(e) {} }

            const i_id = String(data.instrument_id || data.INSTRUMENT_ID); 
            
            if (!i_id || i_id === "undefined") return;

            // Populate dropdown menu
            if (!instruments.has(i_id)) {
                instruments.add(i_id);
                const opt = document.createElement('option');
                opt.value = i_id;
                opt.text = `Instrument ID: ${i_id}`;
                selectEl.appendChild(opt);
                
                if (!selectedInstrumentId) {
                    selectEl.options[0].disabled = true;
                    // Note: Dispatching 'change' here will fetch history automatically for the first connection!
                    selectEl.value = i_id;
                    selectEl.dispatchEvent(new Event('change'));
                }
            }

            // Must match selected selection
            if (i_id === selectedInstrumentId) {
                
                let timeStr;
                if (data.timestamp && data.timestamp !== "") {
                    const d = new Date(data.timestamp);
                    timeStr = d.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit', second: '2-digit' });
                } else {
                    timeStr = new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit', second: '2-digit' });
                }
                
                // 1. Calculate Imbalance
                const totalBuy = parseFloat(data.total_buy_qty || data.TOTAL_BUY_QTY || 0);
                const totalSell = parseFloat(data.total_sell_qty || data.TOTAL_SELL_QTY || 0);
                const totalQty = totalBuy + totalSell;

                let imbalance = 0;
                if (totalQty > 0) {
                    imbalance = ((totalBuy - totalSell) / totalQty) * 100;
                    
                    if (isLive) {
                        imbEl.innerText = (imbalance > 0 ? "+" : "") + imbalance.toFixed(2) + "%";
                        imbEl.style.color = imbalance > 0 ? "var(--buy)" : (imbalance < 0 ? "var(--sell)" : "var(--text)");
                        
                        imbalanceChart.data.datasets[0].borderColor = imbalance > 0 ? '#10b981' : '#ef4444';
                        imbalanceChart.data.datasets[0].backgroundColor = imbalance > 0 ? 'rgba(16, 185, 129, 0.1)' : 'rgba(239, 68, 68, 0.1)';
                    }
                }

                // 2. Process LTP
                const currentLtp = parseFloat(data.ltp || data.LTP);
                if (isLive && !isNaN(currentLtp)) {
                    ltpEl.innerText = currentLtp.toFixed(2);
                    
                    if (lastLtp !== null && currentLtp !== lastLtp) {
                        ltpEl.classList.remove('flash-up', 'flash-down');
                        void ltpEl.offsetWidth; 
                        if (currentLtp > lastLtp) ltpEl.classList.add('flash-up');
                        else if (currentLtp < lastLtp) ltpEl.classList.add('flash-down');
                        
                        setTimeout(() => ltpEl.classList.remove('flash-up', 'flash-down'), 400);
                    }
                    lastLtp = currentLtp;
                }

                // 3. Calculate Microprice
                const bestBid = b5_buy[0] ? parseFloat(b5_buy[0].price) : null;
                const bestBidVol = b5_buy[0] ? parseFloat(b5_buy[0].quantity) : null;
                const bestAsk = b5_sell[0] ? parseFloat(b5_sell[0].price) : null;
                const bestAskVol = b5_sell[0] ? parseFloat(b5_sell[0].quantity) : null;

                let microprice = null;
                if (bestBid !== null && bestAsk !== null && bestBidVol !== null && bestAskVol !== null && (bestBidVol + bestAskVol) > 0) {
                    microprice = (bestBid * bestAskVol + bestAsk * bestBidVol) / (bestBidVol + bestAskVol);
                }

                // Push to the combined line chart arrays
                imbalanceChart.data.labels.push(timeStr);
                imbalanceChart.data.datasets[0].data.push(imbalance);
                imbalanceChart.data.datasets[1].data.push(isNaN(currentLtp) ? null : currentLtp);
                imbalanceChart.data.datasets[2].data.push(microprice);
                
                if (imbalanceChart.data.labels.length > MAX_HISTORY_POINTS) {
                    imbalanceChart.data.labels.shift();
                    imbalanceChart.data.datasets[0].data.shift();
                    imbalanceChart.data.datasets[1].data.shift();
                    imbalanceChart.data.datasets[2].data.shift();
                }

                if (isLive) {
                    imbalanceChart.update();

                    // 4. Update Bar Charts only on live events 
                    buyChart.data.labels = b5_buy.map(b => Number(b.price || 0).toFixed(2));
                    buyChart.data.datasets[0].data = b5_buy.map(b => Number(b.quantity || 0));
                    buyChart.update();

                    sellChart.data.labels = b5_sell.map(s => Number(s.price || 0).toFixed(2));
                    sellChart.data.datasets[0].data = b5_sell.map(s => Number(s.quantity || 0));
                    sellChart.update();
                }
            }
        }
    </script>
</body>
</html>
